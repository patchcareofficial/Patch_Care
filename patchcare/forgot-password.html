
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset password | PatchCare</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div id="site-header"></div>

    <main class="auth-wrap">
        <form class="auth-card" id="forgot-form">
            <span class="eyebrow">ACCOUNT HELP</span>
            <h1>Reset password</h1>
            <p>Enter your email and username, then choose a new password.</p>

            <label>Email address
                <input name="email" type="email" required autocomplete="email">
            </label>

            <label>Username
                <input name="username" required autocomplete="username">
            </label>

            <label>New password
                <div class="password-wrap">
                    <input name="password" id="reset-password"
                           type="password" minlength="8"
                           required autocomplete="new-password">
                    <button type="button" class="password-toggle"
                            data-toggle="reset-password">Show</button>
                </div>
                <small class="password-help">
                    Use at least 8 characters, including uppercase,
                    lowercase, a number, and a special character.
                </small>
            </label>

            <label>Confirm new password
                <div class="password-wrap">
                    <input name="confirm" id="reset-confirm"
                           type="password" minlength="8"
                           required autocomplete="new-password">
                    <button type="button" class="password-toggle"
                            data-toggle="reset-confirm">Show</button>
                </div>
            </label>

            <button class="btn full-width" type="submit">Reset password</button>

            <p class="auth-foot">
                Remembered it? <a href="login.html">Log in</a>
            </p>

            <small class="notice">
                Demo only: this form checks your email and username locally.
            </small>
        </form>
    </main>

    <div id="site-footer"></div>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
