
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in | PatchCare</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div id="site-header"></div>

    <main class="auth-wrap">
        <form class="auth-card" id="login-form">
            <span class="eyebrow">WELCOME BACK</span>
            <h1>Log in</h1>
            <p>Access your PatchCare demo account.</p>

            <label>Email or username
                <input name="identity" required autocomplete="username">
            </label>

            <label>Password
                <div class="password-wrap">
                    <input name="password" id="login-password"
                           type="password" required
                           autocomplete="current-password">
                    <button type="button" class="password-toggle"
                            data-toggle="login-password">Show</button>
                </div>
            </label>

            <div class="auth-row">
                <label class="check-label">
                    <input type="checkbox" name="remember"> Remember me
                </label>
                <a class="forgot-link" href="forgot-password.html">Forgot password?</a>
            </div>

            <button class="btn full-width" type="submit">Log in</button>

            <p class="auth-foot">
                New to PatchCare? <a href="signup.html">Create an account</a>
            </p>

            <small class="notice">
                Demo only: this frontend login is not secure real authentication.
            </small>
        </form>
    </main>

    <div id="site-footer"></div>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
