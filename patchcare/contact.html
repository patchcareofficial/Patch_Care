
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact | PatchCare</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div id="site-header"></div>

    <main class="container page-main">
        <div class="page-intro">
            <span class="eyebrow">WE'RE HERE TO HELP</span>
            <h1>Contact us</h1>
            <p>Send us a message using the form below.</p>
        </div>

        <form class="content-card contact-form" id="contact-form">
            <label>Your name
                <input required name="name">
            </label>

            <label>Email address
                <input required type="email" name="email">
            </label>

            <label>Message
                <textarea required name="message" rows="5"></textarea>
            </label>

            <button class="btn" type="submit">Send message</button>
            <p class="notice">
                Demo form only. No message will be sent to a live support team.
            </p>
        </form>

        <div class="contact-meta">
            <strong>PatchCare</strong>
            <span>Lucena City, Philippines</span>
            <span>Customer support: add your official email and contact number here.</span>
        </div>
    </main>

    <div id="site-footer"></div>

    <script src="js/main.js"></script>
</body>
</html>
